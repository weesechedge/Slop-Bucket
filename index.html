<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slop-Bucket</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --card-hover: #222634;
    --text: #e6e8ee;
    --muted: #9aa0ad;
    --accent: #6ea8fe;
    --border: #2a2e3b;
    --tag: #2a2e3b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --card: #ffffff; --card-hover: #f0f2f5;
      --text: #1a1d27; --muted: #5c6370; --accent: #2563eb;
      --border: #e2e5ea; --tag: #eef1f5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 80px; }
  header { margin-bottom: 28px; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0; }
  .search-row { position: sticky; top: 0; background: var(--bg); padding: 16px 0; z-index: 5; }
  #search {
    width: 100%; padding: 14px 16px; font-size: 1rem; color: var(--text);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  .count { color: var(--muted); font-size: 0.85rem; margin: 4px 2px 16px; }
  .grid { display: grid; gap: 12px; }
  a.card {
    display: block; text-decoration: none; color: inherit; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; transition: background .12s, transform .12s;
  }
  a.card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .card p { margin: 0 0 10px; color: var(--muted); font-size: 0.95rem; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { background: var(--tag); color: var(--muted); font-size: 0.75rem; padding: 3px 9px; border-radius: 999px; }
  .date { color: var(--muted); font-size: 0.78rem; margin-left: auto; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  mark { background: var(--accent); color: #fff; border-radius: 3px; padding: 0 2px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.8rem; text-align: center; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🪣 Slop-Bucket</h1>
    <p class="sub">A bucket of published pages. Search below.</p>
  </header>

  <div class="search-row">
    <input id="search" type="search" placeholder="Search by title, description, or tag…" autocomplete="off" autofocus />
  </div>
  <div class="count" id="count"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No pages match your search.</div>

  <footer>
    Add pages by dropping HTML into <code>pages/</code> and appending to <code>pages.json</code>.
    &nbsp;·&nbsp; <a href="https://github.com/weesechedge/Slop-Bucket">Source</a>
  </footer>
</div>

<script>
  let PAGES = [];
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const search = document.getElementById('search');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return safe.replace(re, '<mark>$1</mark>');
  }

  function render(q) {
    q = (q || '').trim().toLowerCase();
    const matches = PAGES.filter(p => {
      if (!q) return true;
      const hay = [p.title, p.description, (p.tags || []).join(' ')].join(' ').toLowerCase();
      return hay.includes(q);
    });
    grid.innerHTML = matches.map(p => `
      <a class="card" href="${esc(p.path)}">
        <h2>${highlight(p.title || p.slug, q)}</h2>
        ${p.description ? `<p>${highlight(p.description, q)}</p>` : ''}
        <div class="meta">
          ${(p.tags || []).map(t => `<span class="tag">${highlight(t, q)}</span>`).join('')}
          ${p.date ? `<span class="date">${esc(p.date)}</span>` : ''}
        </div>
      </a>`).join('');
    empty.hidden = matches.length > 0;
    countEl.textContent = `${matches.length} of ${PAGES.length} page${PAGES.length === 1 ? '' : 's'}`;
  }

  fetch('pages.json?v=' + Date.now())
    .then(r => r.json())
    .then(data => {
      PAGES = (data.pages || []).slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      render('');
    })
    .catch(() => { countEl.textContent = 'Could not load pages.json'; });

  search.addEventListener('input', e => render(e.target.value));
</script>
</body>
</html>
